name: Market alerts

on:
  schedule:
    - cron: "7 0,4,8,12,16,20 * * *"   # crypto: 7 min after each 4h candle closes (UTC)
    - cron: "40 10 * * 1-5"             # stocks: 16:10 IST on weekdays, after the NSE close
    - cron: "15 4 * * 1-5"              # F&O snapshot: 09:45 IST on weekdays
    - cron: "0 9 * * 1-5"               # F&O snapshot: 14:30 IST on weekdays
  workflow_dispatch:
    inputs:
      market:
        description: Which market to scan now
        type: choice
        options: [crypto, stocks, fno]
        default: crypto

concurrency:
  group: alerts
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scan and push fresh signals to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_CODE: ${{ secrets.ANGEL_CLIENT_CODE }}
          ANGEL_PIN: ${{ secrets.ANGEL_PIN }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          MARKET_INPUT: ${{ inputs.market }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then MARKET="$MARKET_INPUT"
          elif [ "$SCHEDULE" = "40 10 * * 1-5" ]; then MARKET="stocks"
          elif [ "$SCHEDULE" = "15 4 * * 1-5" ] || [ "$SCHEDULE" = "0 9 * * 1-5" ]; then MARKET="fno"
          else MARKET="crypto"; fi
          python -m bot.main alerts "$MARKET"
